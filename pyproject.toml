[project]
name = "osimpy"
version = "0.1.0"
description = "Pythonic wrapper and tools for working with OpenSim models and analyses"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "opensim>=4.6",
    "polars",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "marimo",
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
